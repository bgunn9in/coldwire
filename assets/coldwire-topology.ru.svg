<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" xml:lang="ru">
  <title id="title">COLDWIRE / Маршруты пакетов</title>
  <desc id="desc">Клиент проходит SPA на узле A. A пересылает зашифрованные пакеты AmneziaWG на B. На B завершается туннель. Исключения идут через провайдера.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#76dcff" stroke-opacity=".07"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 .5H4" stroke="#000" stroke-opacity=".15"/></pattern>
    <marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#78f2bf" stroke-width="1.5"/></marker>
    <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#76dcff" stroke-width="1.5"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#f2bd73" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="420" fill="#060c12"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect x="16" y="16" width="1168" height="388" fill="none" stroke="#314b58"/>
  <path d="M16 52V16H60M1140 404H1184V368" fill="none" stroke="#78f2bf" stroke-width="2"/>
  <path d="M36 81H1164M36 365H1164" stroke="#314b58"/>
  <g font-family="Consolas, Liberation Mono, Menlo, monospace">
    <rect x="40" y="47" width="8" height="8" fill="#78f2bf"/>
    <text x="61" y="57" fill="#78f2bf" font-size="21" letter-spacing="3">COLDWIRE</text>
    <text x="1160" y="56" fill="#a4b9c3" font-size="16" letter-spacing="2" text-anchor="end">МАРШРУТЫ ТРАФИКА</text>
    <text x="172" y="109" fill="#76dcff" font-size="15">SPA / ДОПУСК УСТРОЙСТВА</text>
    <path d="M113 149V121H455V149" fill="none" stroke="#76dcff" stroke-width="2" marker-end="url(#cyan)" stroke-dasharray="6 4"/>
    <path d="M258 213H340" fill="none" stroke="#78f2bf" stroke-width="2" marker-end="url(#mint)"/>
    <text x="299" y="197" fill="#78f2bf" font-size="14" text-anchor="middle">AWG</text>
    <path d="M574 213H670" fill="none" stroke="#78f2bf" stroke-width="2" marker-end="url(#mint)"/>
    <text x="622" y="197" fill="#78f2bf" font-size="14" text-anchor="middle">AWG</text>
    <path d="M894 213H961" fill="none" stroke="#78f2bf" stroke-width="2" marker-end="url(#mint)"/>
    <path d="M145 259V306L158 319H961" fill="none" stroke="#f2bd73" stroke-width="2" marker-end="url(#amber)"/>
    <text x="172" y="302" fill="#f2bd73" font-size="15">ИСКЛЮЧЕНИЯ / ЧЕРЕЗ ПРОВАЙДЕРА</text>
    <path d="M40 161l12 -12h206v98l-12 12h-206z" fill="#0b171f" stroke="#314b58"/>
    <path d="M40 176v-15l12 -12h29" fill="none" stroke="#78f2bf" stroke-width="2"/>
    <text x="54" y="180" fill="#78f2bf" font-size="17" letter-spacing="1">КЛИЕНТ</text>
    <path d="M54 192h190" stroke="#314b58"/>
    <text x="54" y="214" fill="#e7f5f3" font-size="15">COLDWIRE Amnezia VPN</text>
    <text x="54" y="236" fill="#e7f5f3" font-size="15">AmneziaWG 3.1</text>
    <path d="M340 161l12 -12h222v98l-12 12h-222z" fill="#0b171f" stroke="#314b58"/>
    <path d="M340 176v-15l12 -12h29" fill="none" stroke="#76dcff" stroke-width="2"/>
    <text x="354" y="180" fill="#76dcff" font-size="17" letter-spacing="1">A / ВХОД</text>
    <path d="M354 192h206" stroke="#314b58"/>
    <text x="354" y="214" fill="#e7f5f3" font-size="15">Проверяет ключ SPA</text>
    <text x="354" y="236" fill="#e7f5f3" font-size="15">Допуск IPv4 · 120 с / NAT</text>
    <path d="M670 161l12 -12h212v98l-12 12h-212z" fill="#0b171f" stroke="#314b58"/>
    <path d="M670 176v-15l12 -12h29" fill="none" stroke="#78f2bf" stroke-width="2"/>
    <text x="684" y="180" fill="#78f2bf" font-size="17" letter-spacing="1">B / ВЫХОД</text>
    <path d="M684 192h196" stroke="#314b58"/>
    <text x="684" y="214" fill="#e7f5f3" font-size="15">AmneziaWG 3.1</text>
    <text x="684" y="236" fill="#e7f5f3" font-size="15">Завершает туннель</text>
    <path d="M961 161l12 -12h187v98l-12 12h-187z" fill="#0b171f" stroke="#314b58"/>
    <path d="M961 176v-15l12 -12h29" fill="none" stroke="#78f2bf" stroke-width="2"/>
    <text x="975" y="180" fill="#78f2bf" font-size="17" letter-spacing="1">ИНТЕРНЕТ</text>
    <path d="M975 192h171" stroke="#314b58"/>
    <text x="975" y="214" fill="#e7f5f3" font-size="15">Сайты видят IPv4 B</text>
    <path d="M961 292l12 -12h187v64l-12 12h-187z" fill="#0b171f" stroke="#314b58"/>
    <path d="M961 307v-15l12 -12h29" fill="none" stroke="#f2bd73" stroke-width="2"/>
    <text x="975" y="311" fill="#f2bd73" font-size="17" letter-spacing="1">САЙТЫ ИЗ СПИСКА</text>
    <path d="M975 323h171" stroke="#314b58"/>
    <text x="975" y="345" fill="#e7f5f3" font-size="15">Виден IP провайдера</text>
    <text x="40" y="389" fill="#c27be8" font-size="15">УПРАВЛЕНИЕ /  SPA администратора на A  →  SSH на A  →  SSH на B через A</text>
  </g>
  <rect width="1200" height="420" fill="url(#scan)"/>
</svg>
