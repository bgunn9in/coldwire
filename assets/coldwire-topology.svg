<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">COLDWIRE // ROUTING MAP</title>
<desc id="desc">The client reaches entry A over AWG UDP or REALITY TCP. The DNAT/SNAT relay forwards encrypted traffic to exit B; websites see B’s address. The client sends selected Russian destinations directly through its ISP.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#76dcff" stroke-opacity=".055"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 .5H4" stroke="#000" stroke-opacity=".16"/></pattern>
  <filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#76dcff" stroke-width="1.5"/></marker>
  <marker id="direct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#f2bd73" stroke-width="1.5"/></marker>
</defs>
